<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16295a"/>
      <stop offset="0.22" stop-color="#3a3d78"/>
      <stop offset="0.38" stop-color="#8a5486"/>
      <stop offset="0.52" stop-color="#ee8f62"/>
      <stop offset="1" stop-color="#f3a35b"/>
    </linearGradient>
    <linearGradient id="far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f8f63"/>
      <stop offset="1" stop-color="#2c6b4a"/>
    </linearGradient>
    <linearGradient id="near" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5cb86f"/>
      <stop offset="1" stop-color="#2f7d4f"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fffbe8"/>
      <stop offset="0.6" stop-color="#ffe39a"/>
      <stop offset="1" stop-color="#ffc66b"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.45" stop-color="#ffe0a0" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffb070" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="tile">
      <rect x="8" y="8" width="240" height="240" rx="54"/>
    </clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect x="0" y="0" width="256" height="256" fill="url(#sky)"/>
    <!-- Sun setting into the dip between the hills, where the track leads -->
    <circle cx="140" cy="128" r="60" fill="url(#glow)"/>
    <circle cx="140" cy="128" r="28" fill="url(#sun)"/>
    <path d="M0 150 C40 118 78 112 112 128 C146 144 176 120 210 112 C232 107 248 116 256 122 L256 256 L0 256 Z" fill="url(#far)"/>
    <path d="M0 176 C44 150 90 156 128 166 C170 177 210 160 256 150 L256 256 L0 256 Z" fill="url(#near)"/>
    <!-- Track running towards the hills -->
    <path d="M70 256 L120 164 L136 164 L186 256 Z" fill="#8b7d6d"/>
    <g fill="#4b3424">
      <path d="M78 246 L178 246 L174 238 L82 238 Z"/>
      <path d="M90 223 L166 223 L163 216 L93 216 Z"/>
      <path d="M100 203 L156 203 L154 197 L102 197 Z"/>
      <path d="M108 187 L148 187 L146 182 L110 182 Z"/>
      <path d="M114 175 L142 175 L141 171 L115 171 Z"/>
    </g>
    <path d="M90 256 L98 256 L125 164 L122 164 Z" fill="#e8eaf0"/>
    <path d="M158 256 L166 256 L134 164 L131 164 Z" fill="#e8eaf0"/>
    <!-- Signal post -->
    <path d="M200 196 L200 140" stroke="#20242c" stroke-width="5" stroke-linecap="round"/>
    <rect x="191" y="128" width="18" height="26" rx="6" fill="#20242c"/>
    <circle cx="200" cy="137" r="5" fill="#6ff0a0"/>
  </g>
  <rect x="8" y="8" width="240" height="240" rx="54" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="3"/>
</svg>
